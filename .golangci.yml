version: "2"
linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gosec
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
    paths:
      - internal/web/node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
