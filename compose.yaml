services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: dashmap
      POSTGRES_USER: dashmap
      POSTGRES_PASSWORD: dashmap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashmap -d dashmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://dashmap:dashmap@postgres:5432/dashmap?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_FORMAT: json
      # Optionally mount a regional .pmtiles file and set this env var to enable the basemap.
      # Example: BASEMAP_PMTILES: /basemap/my-region.pmtiles
      # Download a regional extract from https://maps.protomaps.com/builds/ (use pmtiles extract).
      # BASEMAP_PMTILES:
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://dashmap:dashmap@postgres:5432/dashmap?sslmode=disable
      VIDEO_ROOT: /footage
      SCAN_INTERVAL: 5m
      LOG_FORMAT: json
    volumes:
      - /tmp/dashmap-footage:/footage
    depends_on:
      postgres:
        condition: service_healthy

  test-runner:
    profiles: ["test"]
    image: golang:1.26-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
    environment:
      DATABASE_URL: postgres://dashmap:dashmap@postgres:5432/dashmap?sslmode=disable
      GOMODCACHE: /go/pkg/mod
      GOFLAGS: -buildvcs=false
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - "go test -tags integration $(go list ./cmd/... ./internal/... | grep -v node_modules)"

volumes:
  pgdata:
  go-mod-cache:
