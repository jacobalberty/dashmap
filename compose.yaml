services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: dashmap
      POSTGRES_USER: dashmap
      POSTGRES_PASSWORD: dashmap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashmap -d dashmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://dashmap:dashmap@postgres:5432/dashmap?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["/dashmap", "worker"]
    environment:
      DATABASE_URL: postgres://dashmap:dashmap@postgres:5432/dashmap?sslmode=disable
      VIDEO_ROOT: /footage
      SCAN_INTERVAL: 5m
      LOG_FORMAT: json
    volumes:
      - /tmp/dashmap-footage:/footage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
