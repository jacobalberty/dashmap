name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dashmap
          POSTGRES_USER: dashmap
          POSTGRES_PASSWORD: dashmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashmap -d dashmap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet $(go list ./cmd/... ./internal/... | grep -v node_modules)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: unit tests
        run: go test $(go list ./cmd/... ./internal/... | grep -v node_modules)

      - name: integration tests
        env:
          DATABASE_URL: postgres://dashmap:dashmap@localhost:5432/dashmap?sslmode=disable
        run: go test -tags integration $(go list ./cmd/... ./internal/... | grep -v node_modules)

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: buf lint
        run: buf lint

      - name: buf generate (no-diff check)
        run: |
          buf generate
          if ! git diff --exit-code; then
            echo "Generated proto code is out of sync. Run 'make proto-gen' and commit."
            exit 1
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: dashmap:ci
